<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlindBudet — Bud v1: Ren sifferruta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fff7ec; --bg-2: #ffeccf; --ink: #2b2118; --ink-soft: #7a6a58;
      --card: #fffdf9; --line: #f0e0c8; --accent: #ff5d73;
      --radius: 22px; --shadow: 0 10px 24px -12px rgba(120,80,20,.45);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: 'Nunito', system-ui, sans-serif; color: var(--ink);
      background: radial-gradient(120% 80% at 50% -10%, var(--bg-2), transparent 60%), var(--bg);
      min-height: 100vh; -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 520px; margin-inline: auto; padding: 1.25rem 1.1rem 3rem; }
    .brand { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
    .logo { font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 1.35rem; }
    .pill { font-family: 'Baloo 2', cursive; font-weight: 700; font-size: .8rem;
      background: var(--ink); color: var(--bg); padding: .35rem .8rem; border-radius: 999px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 1.5rem 1.35rem; margin-bottom: 1.5rem; }
    h1 { font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 1.7rem; line-height: 1.1; margin: 0 0 .35rem; }
    .sub { color: var(--ink-soft); margin: 0 0 1.4rem; font-size: .95rem; }
    label { display: block; font-family: 'Baloo 2', cursive; font-weight: 700; font-size: .95rem; margin: 0 0 .6rem; }

    /* the bid field — number restyled as a big text box, native spinner killed */
    .bidfield { display: flex; align-items: stretch; gap: .6rem; }
    input[type=number] {
      -moz-appearance: textfield; appearance: textfield;
      flex: 1; min-width: 0; text-align: center;
      font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 2.4rem; color: var(--accent);
      background: var(--bg); border: 2px solid var(--line); border-radius: 16px;
      padding: .9rem 1rem; transition: border-color .12s, box-shadow .12s;
    }
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number]:focus { outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(255,93,115,.18); }
    input[type=number]::placeholder { color: var(--line); }
    .unitpill {
      display: flex; align-items: center; padding: 0 1.1rem; border-radius: 16px;
      background: var(--ink); color: var(--bg); font-family: 'Baloo 2', cursive; font-weight: 700;
      font-size: 1.05rem; white-space: nowrap;
    }
    .submit { appearance: none; cursor: pointer; width: 100%; margin-top: 1.75rem;
      border: none; border-radius: 16px; padding: 1.05rem; font-family: 'Baloo 2', cursive;
      font-weight: 800; font-size: 1.15rem; color: #fff;
      background: linear-gradient(135deg, var(--accent), #ff8a3d);
      box-shadow: 0 10px 22px -8px rgba(255,93,115,.7); transition: transform .12s; }
    .submit:active { transform: scale(.98); }
    .back { display: block; text-align: center; margin-top: .5rem; color: var(--ink-soft); font-size: .85rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="logo">Blind<span style="color:var(--accent)">Budet</span></div>
      <span class="pill">v1 · Ren sifferruta</span>
    </div>

    <div class="card">
      <div class="pill" style="background:var(--bg-2);color:var(--ink-soft);display:inline-block;margin-bottom:1rem">Lott 3 / 7</div>
      <h1>Höjden på Mount Everest över havet</h1>
      <p class="sub">Vad tror du den är värd? Ditt bud är hemligt tills alla har bjudit.</p>

      <label for="amount1">Ditt bud</label>
      <div class="bidfield">
        <input type="number" id="amount1" min="0" step="any" inputmode="decimal" placeholder="0" />
        <span class="unitpill">meter</span>
      </div>

      <button type="button" class="submit">Lägg bud!</button>
    </div>

    <div class="card">
      <div class="pill" style="background:var(--bg-2);color:var(--ink-soft);display:inline-block;margin-bottom:1rem">Lott 5 / 7</div>
      <h1>Toppfarten för en sengångare</h1>
      <p class="sub">Litet spann — samma ruta funkar. Skriv decimaler direkt.</p>

      <label for="amount2">Ditt bud</label>
      <div class="bidfield">
        <input type="number" id="amount2" min="0" step="any" inputmode="decimal" placeholder="0" />
        <span class="unitpill">km/h</span>
      </div>

      <button type="button" class="submit">Lägg bud!</button>
    </div>

    <a class="back" href="bid-compare.html">← Tillbaka till jämförelsen</a>
  </div>
</body>
</html>
