<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mer eller Mindre — Lobby (spelare)</title>
  <link rel="stylesheet" href="playful.css" />
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="logo"><span class="mer">Mer</span> eller <span class="mindre">Mindre</span></div>
      <span class="pill soft">Du är med</span>
    </div>

    <div class="card center">
      <h1>Du är med, Nils! 🎉</h1>
      <p class="sub">Väntar på att Martin startar omgången…</p>
      <p class="busy">Inväntar start</p>
    </div>

    <div class="card">
      <div class="cardhead">Spelare <span class="pill">3 med</span></div>
      <ul class="players">
        <li><span class="dot"></span><span class="who">Martin</span><span class="tag">värd</span></li>
        <li><span class="dot"></span><span class="who">Nils</span><span class="tag">du</span></li>
        <li><span class="dot"></span><span class="who">Sven</span><span class="tag">med</span></li>
      </ul>
    </div>

    <p class="fakenav next-hint">Systemet startar automatiskt när spelledaren trycker. · <a href="question.html">simulera start →</a></p>
    <p class="fakenav"><a href="../index.html">← Tillbaka till jämförelsen</a></p>
  </div>
</body>
</html>
