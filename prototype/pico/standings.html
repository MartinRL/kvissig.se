<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mer eller Mindre — Slutställning</title>
  <link rel="stylesheet" href="playful.css" />
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="logo"><span class="mer">Mer</span> eller <span class="mindre">Mindre</span></div>
      <span class="pill">Slut · 8 frågor klara</span>
    </div>

    <div class="card center">
      <h1>Slutställning</h1>
      <p class="winner-banner"><span class="name">Nils</span> vann! 🏆</p>
      <p class="muted">Lägst total poäng vinner.</p>

      <table class="scoreboard" style="margin-top:1rem">
        <tbody>
          <tr class="winner">
            <td class="rank">1</td>
            <td class="who">Nils</td>
            <td class="total">5</td>
          </tr>
          <tr>
            <td class="rank">2</td>
            <td class="who">Sven</td>
            <td class="total">12</td>
          </tr>
          <tr>
            <td class="rank">3</td>
            <td class="who">Martin <small class="muted">(du)</small></td>
            <td class="total">18</td>
          </tr>
        </tbody>
      </table>
    </div>

    <a class="btn" href="catalog.html">Spela igen</a>

    <p class="fakenav"><a href="../index.html">← Tillbaka till jämförelsen</a></p>
  </div>
</body>
</html>
