<!DOCTYPE html>
<html lang="sv" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mer eller Mindre — Slutställning</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <main class="container">
    <header class="mem-brand">
      <div class="logo"><span class="mer">Mer</span> eller <span class="mindre">Mindre</span></div>
      <div class="progress-label">Slut · 8 frågor klara</div>
    </header>

    <article class="center">
      <h2>Slutställning</h2>
      <p class="winner-banner"><span class="name">Nils</span> vann! 🏆</p>
      <p class="muted">Lägst total poäng vinner.</p>

      <table class="scoreboard">
        <tbody>
          <tr class="winner">
            <td class="rank">1</td>
            <td class="who">Nils</td>
            <td class="total">5</td>
          </tr>
          <tr>
            <td class="rank">2</td>
            <td class="who">Sven</td>
            <td class="total">12</td>
          </tr>
          <tr>
            <td class="rank">3</td>
            <td class="who">Martin <small class="muted">(du)</small></td>
            <td class="total">18</td>
          </tr>
        </tbody>
      </table>
    </article>

    <a href="catalog.html" role="button">Spela igen</a>

    <p class="fakenav"><a href="../index.html">← Tillbaka till jämförelsen</a></p>
  </main>
</body>
</html>
