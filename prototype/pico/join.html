<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mer eller Mindre — Gå med</title>
  <link rel="stylesheet" href="playful.css" />
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="logo"><span class="mer">Mer</span> eller <span class="mindre">Mindre</span></div>
      <span class="pill soft">QR skannad</span>
    </div>

    <div class="card">
      <h1>Gå med i omgången</h1>
      <p class="sub">Kod <strong>MEM-4827</strong> · värd Martin</p>

      <form action="lobby-player.html" method="get">
        <label for="name">Ditt namn</label>
        <input type="text" id="name" name="name" value="Nils" placeholder="Skriv ditt namn" autofocus required />
        <button type="submit" class="btn">Gå med</button>
      </form>

      <p class="muted center" style="margin-top:1rem">Skannade du fel? <a href="#">Skriv koden manuellt</a></p>
    </div>

    <p class="fakenav"><a href="../index.html">← Tillbaka till jämförelsen</a></p>
  </div>
</body>
</html>
