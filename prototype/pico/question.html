<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mer eller Mindre — Fråga 3</title>
  <link rel="stylesheet" href="playful.css" />
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="logo"><span class="mer">Mer</span> eller <span class="mindre">Mindre</span></div>
      <span class="pill">Fråga 3 / 8</span>
    </div>

    <div class="card">
      <h1>Vilken elbil kommer längst på en laddning?</h1>
      <p class="sub">WLTP-räckvidd · Bilar &amp; Motor</p>

      <p class="steplabel">1 · Vilken är mer?</p>
      <div class="direction" role="group" aria-label="Riktning">
        <button type="button" class="dirbtn" data-car="vw" aria-pressed="true">
          <span class="arrow">▲</span> VW ID.4 Pro
        </button>
        <button type="button" class="dirbtn" data-car="bmw" aria-pressed="false">
          <span class="arrow">▼</span> BMW iX3
        </button>
      </div>

      <p class="steplabel">2 · Hur stor är skillnaden?</p>
      <div class="diffwrap">
        <div class="diffout" id="diffOut">30</div>
        <input type="range" id="diff" min="0" max="100" value="30" step="1" />
        <div class="scale"><span>0 · lika</span><span>50 · hälften</span><span>100 · nästan allt</span></div>
      </div>

      <div class="twobars" aria-hidden="true">
        <div class="bar" id="barVW"><span class="bval">mer</span><span class="barcap">VW</span></div>
        <div class="bar" id="barBMW"><span class="bval">mindre</span><span class="barcap">BMW</span></div>
      </div>

      <a class="btn" href="waiting.html" style="margin-top:1.75rem">Gissa!</a>
    </div>

    <p class="fakenav"><a href="../index.html">← Tillbaka till jämförelsen</a></p>
  </div>

  <script>
    const out = document.getElementById('diffOut');
    const range = document.getElementById('diff');
    const bars = { vw: document.getElementById('barVW'), bmw: document.getElementById('barBMW') };
    const buttons = document.querySelectorAll('.direction button');

    function render() {
      const v = Number(range.value);
      out.textContent = v;
      range.style.background = `linear-gradient(90deg, var(--accent) ${v}%, var(--line) ${v}%)`;
      const selected = document.querySelector('.direction button[aria-pressed="true"]').dataset.car;
      for (const [car, el] of Object.entries(bars)) {
        const isMer = car === selected;          // selected car = "mer" = the tall bar
        el.classList.toggle('is-mer', isMer);
        el.classList.toggle('is-mindre', !isMer);
        el.style.height = isMer ? '100%' : (100 - v) + '%';   // the OTHER bar shrinks
        el.querySelector('.bval').textContent = isMer ? 'mer' : 'mindre';
      }
    }

    range.addEventListener('input', render);
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => {
          const pressed = b === btn;
          b.setAttribute('aria-pressed', pressed ? 'true' : 'false');
          b.querySelector('.arrow').textContent = pressed ? '▲' : '▼';
        });
        render();
      });
    });
    render();
  </script>
</body>
</html>
