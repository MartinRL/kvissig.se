<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mer eller Mindre — Gå med</title>
  <link rel="stylesheet" href="https://early.webawesome.com/webawesome@3.0.0-beta.4/dist/styles/webawesome.css" />
  <script type="module" src="https://early.webawesome.com/webawesome@3.0.0-beta.4/dist/webawesome.loader.js"></script>
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <div class="page">
    <header class="mem-brand">
      <div class="logo"><span class="mer">Mer</span> eller <span class="mindre">Mindre</span></div>
      <div class="progress-label">Du skannade spelledarens QR</div>
    </header>

    <wa-card with-header>
      <div slot="header">Gå med i omgången</div>
      <p class="muted">Kod <strong>MEM-4827</strong> · värd Martin</p>

      <form id="joinForm">
        <wa-input name="name" label="Ditt namn" value="Nils" placeholder="Skriv ditt namn" autofocus></wa-input>
        <wa-button type="submit" variant="brand" class="block" style="margin-top:1rem">Gå med</wa-button>
      </form>

      <p class="muted center" style="margin-top:1rem">Skannade du fel? <a href="#">Skriv koden manuellt</a></p>
    </wa-card>

    <p class="fakenav"><a href="../index.html">← Tillbaka till jämförelsen</a></p>
  </div>

  <script type="module">
    document.getElementById('joinForm').addEventListener('submit', e => {
      e.preventDefault();
      window.location.href = 'lobby-player.html';
    });
  </script>
</body>
</html>
