# Blindbudet — Experience Model (xmlang v0.2.0), reverse-engineered AS-IMPLEMENTED from
# the shipped UI (Components/Blindbudet/*.razor, AuctionScreenModels.cs, playful.css)
# against specs/blindbudet-event-model.yaml. Judgments were read off the running product
# and recorded as data; nothing here is invented.
#
# Findings from the reverse-engineering (spec dogfood notes):
#   1. The EM originally modeled SURFACES instead of data nouns (`Screen /` view lane);
#      v0.2's xm-screen-lane-view info documented the smell. RESOLVED: screen views are
#      now bare data nouns (Roster, Round scores, Scoreboard) across all three games.
#   2. Bare command forms exist in the real UI exactly as the strict compose rule predicts:
#      AuctionHostForm (OpenAuction) and AuctionJoinForm (JoinAuction) compose no view and
#      are therefore NOT surfaces here — they are served by the transformer's defaults.
#   3. EM/UI divergence: the EM has AskNextLot/EndAuction as ⚙️ System processors gated by
#      Todo read-models; the implemented UI gives the host explicit buttons ("Nästa
#      budrunda" / "Visa slutställning") on the round-results screen. As-implemented, both
#      commands are composed on RundresultatVärd.
#   4. Host/player screen variants (lobby, round results) map cleanly to `for:`-scoped
#      surfaces; the shared view is composed twice with different salience/commands.
#   5. The keypad bid input and the 2 s polling wait states are concrete-UI stratum:
#      correctly inexpressible in xmlang (geometry/behavior prohibition holds).
#   6. RESOLVED in v0.2: dotted label paths broke on EM names containing `/` and spaces;
#      labels are now nested exact-name maps (rename-indifferent by construction).
#   7. Katalog carries no `during:` — the catalog is STREAM-LESS reference data shown before
#      any auction exists (AuctionPhase's NotCreated is a C# sentinel, not an EM phase).
#      A phase claim would be invented, so the surface stays active in all phases.
#   8. `during` × `for` places every game surface, but the started-phase player split
#      (Budgivning vs Väntan vs Rundresultat: has the viewer bid? is the lot resolved?)
#      is exactly the fine selection v0.2 declares inexpressible — it stays a hand-written
#      selector (AuctionScreens.Select) in the concrete stratum.

xmlang: "0.2"
model: blindbudet-event-model.yaml

personas:
  Värd:
    role: 🧑‍🏫 host
    props:
      goal: open and start the auction, drive the reveal pacing — and play along
      device: phone in hand
      context: co-located party, one room, everyone on their own screen
  Spelare:
    role: 🧑‍🎓 Player
    props:
      goal: join via QR/link, estimate under hidden information without overbidding
      device: phone in hand
      context: co-located party, one room

surfaces:
  Katalog:
    # no during: — stream-less reference data (finding 7)
    compose:
      - v: Pack catalog
        fields:
          primary: [packs]
      - c: OpenAuction
        prominence: primary

  LobbyVärd:
    during: [lobby]
    for: [Värd]
    compose:
      - v: Roster
        self: players.playerId
        fields:
          primary: [joinCode, players]
          on-demand: [gameId]
      - c: StartAuction
        prominence: primary

  LobbySpelare:
    during: [lobby]
    for: [Spelare]
    compose:
      - v: Roster
        self: players.playerId
        fields:
          primary: [players]
          on-demand: [joinCode, gameId]

  Budgivning:
    during: [started]
    compose:
      - v: Lot card
        fields:
          primary: [description, unit]
          secondary: [lotIndex, totalLots]
          on-demand: [gameId]
      - c: PlaceBid
        prominence: primary

  Väntan:
    during: [started]
    compose:
      - v: Bid progress
        # identity lives in the id lists themselves; the viewer is by construction in
        # submittedPlayerIds (you only see Väntan after your own bid) — "du · klar"
        self: submittedPlayerIds
        fields:
          primary: [pendingPlayerIds]
          secondary: [submittedPlayerIds, lotIndex]
          on-demand: [gameId]

  RundresultatVärd:
    during: [started]
    for: [Värd]
    compose:
      - v: Round scores
        self: playerProfits.playerId
        fields:
          primary: [trueWorth, winnerIds, playerProfits]
          secondary: [pricePaid, lotIndex]
          on-demand: [gameId]
      - c: AskNextLot        # see finding 3: System processor in the EM, host button in the UI
        prominence: primary
      - c: EndAuction        # see finding 3
        prominence: primary

  RundresultatSpelare:
    during: [started]
    for: [Spelare]
    compose:
      - v: Round scores
        self: playerProfits.playerId
        fields:
          primary: [trueWorth, winnerIds, playerProfits]
          secondary: [pricePaid, lotIndex]
          on-demand: [gameId]

  Slutställning:
    during: [ended]
    compose:
      - v: Scoreboard
        fields:
          primary: [finalScoreboard, winnerIds]
          on-demand: [gameId]

journeys:
  VärdensAuktion:
    for: [Värd]
    slices:
      - ✍️ Open Auction
      - ✍️ Start Auction
      - ✍️ Place Bid
      - ✍️ Reveal Lot
      - ✍️ Next Lot
      - ✍️ End Auction
  SpelarensRunda:
    for: [Spelare]
    slices:
      - ✍️ Join Auction
      - ✍️ Place Bid
      - ✍️ Reveal Lot

# Copy harvested verbatim from the Razor components (sv-SE, playful/informal register).
# v0.2 nested labels: keys are EXACT element names (no dotted paths); $self = the
# element's own label beside field keys, $empty = empty-state copy.
labels:
  sv:
    register: lekfull, informell
    # commands (+ their form fields)
    OpenAuction:
      $self: Skapa auktion
      hostName: Ditt namn
    JoinAuction:
      $self: Gå med
      playerName: Ditt namn
    StartAuction: Starta auktion
    PlaceBid:
      $self: Lägg bud!
      amount: Ditt bud
    AskNextLot: Nästa budrunda
    EndAuction: Visa slutställning
    # view fields
    "Roster":
      players: Spelare
    "Bid progress":
      submittedPlayerIds: Klara
      pendingPlayerIds: Väntar på
    "Round scores":
      trueWorth: Sant värde
      playerProfits: Poäng
      pricePaid: Bud
      winnerIds:
        $empty: Ingen vann – alla bjöd över.
    "Scoreboard":
      finalScoreboard: Slutställning
    # surfaces (their on-screen headings)
    Katalog: Välj lek
    LobbyVärd: Skanna för att gå med
    LobbySpelare: Du är med! 🎉
    Väntan: Ditt bud är lagt ✓
    Slutställning: Slutställning
    # personas
    Värd: Värd
    Spelare: Spelare

