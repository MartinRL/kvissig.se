# Mer eller Mindre — Event-Modeling spec for one round ("omgång").
# Transcribed from specs/MEM-omgång.png. See specs/CLAUDE.md for conventions.
#
# Conventions:
#   triggers carry the actor role + originating screen
#                                  (GameMaster / Quiz catalog, Player / Question, System / ...)
#   commands are bare              (OpenLobby, SubmitGuess)
#   events carry the stream        (Game / LobbyOpened)
#   exceptions are bare            (GameNotFound)
#   views carry a view lane        (Screen / Game lobby, Todo / Outstanding guesses)
#
# View lanes:
#   State / ...   the decider's decision model (folded GameState); read by `decide`
#   Screen / ...  human screens players & the GM actually see
#   Todo / ...    processor-facing read-models the System observes (never shown)
# NOTE: emlang parses + lints these view-lane prefixes fine, but the diagram renders
#   views by their bare name without a per-view lane label (only triggers and events
#   get a visible swimlane label). The prefix still documents intent and maps to code.
#
# Verification is decider-true (see docs/adr/decider-pattern.svg):
#   Given -> state (prior events folded via evolve)   When -> command   Then -> events|x
# emlang has no `state` element, so the decider's Given is expressed as a VIEW:
# State / Game, the single folded decision model (one Decider per game, one State).
# Every command/processor slice references `State / Game` in `given:`, asserting only
# the props that case relies on. GWT given:s never replay events — that is what the
# State / Game / Todo / Screen view-slices' own GT (prior events -> view) verify.
#
# Automations are the Event-Modeling PROCESSOR pattern, not a dedicated element
# (emlang has no cog/gear): event(s) -> Todo read-model -> System trigger -> command
# -> event(s) -> Screen. The Todo read-model is MINIMAL (only what the gear needs to
# see a task exists) and SEPARATE from State / Game — an event feeds many green boxes;
# the decision model is never reused as a todo list. "All guesses in" is therefore a
# CONDITION of a todo read-model (Todo / Outstanding guesses), not an event. The game
# is co-located (one room, like a board game) so automations fire on a STATE CONDITION,
# never a clock — there are NO timeouts and no Passage-of-Time slices (a documented
# future possibility only).
#
# Scoring (see ScoreQuestion / QuestionScored):
#   roundScore = |guessedDifference - correctDifference| + (directionCorrect ? -10 : 0)
#   lowest total score wins; negative scores possible (exact difference + right
#   direction = -10, the best possible round).
#
#   The guessedDifference players submit is a 0-100 slider value. The question card
#   stores the two RAW absolute values (valueA, valueB) — never a 0-100 number — so the
#   author just types the real figures, no mental arithmetic. ScoreQuestion balances
#   them onto 0-100: it derives correctDirection (whichever value is larger) and reveals
#   correctDifference = |A-B| / max(A,B) * 100. Picture the two values as two bars side
#   by side; the difference is how much taller the tall bar is, as a share of the tall
#   bar itself:
#     equal bars            -> 0
#     short bar = half tall -> 50
#     short bar = a tenth   -> 90
#     short bar ~ nothing   -> near 100
#   This deliberately compresses large ratios (2x->50, 10x->90, 100x->99): small
#   differences are the fun ones to pin down, giant ones are obviously giant.
#   Simplicity is the guiding star. For quantities already measured on a multiplicative
#   scale (decibel, Richter, pH), those scale values are themselves what gets balanced.
#
#   correctDirection/correctDifference are derived by ScoreQuestion and revealed once
#   per question on Game / QuestionAnswered; per-player scoring is one
#   Game / QuestionScored each.
#
# ASSUMPTION: the board's two guess screens (direction, then difference) are modeled
# as a single SubmitGuess {direction, difference} command, matching the C# domain.
# Split into two commands only if the board later demands it.
#
# ASSUMPTION: question-card content (text, option labels, and the two RAW values
# valueA/valueB) is snapshotted onto Game / LobbyOpened (questions: Question[]).
# OpenLobby resolves the chosen pack via a GameContext dependency and stamps the full
# question set, so read models read events only. Screen / Question reads card
# text/labels by index from folded state; totalQuestions = questions.Count. The card
# carries NO precomputed answer — the per-question reveal (correctDirection/normalized
# correctDifference) is derived by the decider from valueA/valueB in that state.
#
# Prop types (these annotations ARE the intended C# types; see specs/CLAUDE.md):
#   ids                    Guid          (gameId, playerId, hostPlayerId, winnerId,
#                                         questionPackId, packId, joinCode, and *PlayerIds[])
#   timestamps (*At)       DateTimeOffset
#   direction              Direction (mer|mindre)  — enum
#   difference family      int (0-100)   (difference, guessedDifference, and the
#                                         derived correctDifference — never on the card)
#   raw card values        double        (valueA, valueB — real magnitudes, any unit)
#   points/scores          int           (may be negative per scoring rule)
#   index/count            int

slices:

  # --- Decision model (decider State) --------------------------------------

  # State / Game is the folded GameState the decider's `decide` reads — the SINGLE
  # decision model (one Decider per game, one State). emlang has no `state` element,
  # so every command/processor slice expresses its Given as this view (see
  # docs/adr/decider-pattern.svg: Given = prior events -> state via evolve). A GWT
  # case asserts only the props its `decide` actually reads. This box is distinct from
  # the minimal Todo / read-models the System processors gate on — an event feeds both.
  #
  # Guess / total fixtures (current-question State, reused by Score Question GWT):
  #   martinGuessMer30    = { playerId: martinId, direction: mer,    difference: 30 }
  #   martinGuessMer40    = { playerId: martinId, direction: mer,    difference: 40 }
  #   martinGuessMindre25 = { playerId: martinId, direction: mindre, difference: 25 }
  #   nilsGuessMindre50   = { playerId: nilsId,   direction: mindre, difference: 50 }
  #   nilsGuessMindre20   = { playerId: nilsId,   direction: mindre, difference: 20 }
  #   martinTotal0        = { playerId: martinId, totalScore: 0 }
  #   nilsTotal10         = { playerId: nilsId,   totalScore: 10 }
  State Game:
    steps:
      - v: State / Game
        props:
          gameId: Guid
          joinCode: Guid
          phase: GamePhase (lobby|started|ended)
          hostPlayerId: Guid
          players: Player[]              # { playerId: Guid, name: string, isHost: bool }
          questions: Question[]          # raw valueA/valueB per card; no precomputed answer
          currentQuestionIndex: int
          guesses: Guess[]               # current question only: { playerId: Guid, direction: Direction (mer|mindre), difference: int (0-100) }
          pendingPlayerIds: Guid[]       # joined players yet to guess the current question
          currentQuestionScored: bool    # the current question was already revealed/scored
          totalScores: PlayerTotal[]     # running { playerId: Guid, totalScore: int }
    tests:
      state folds events into the decision model:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode, hostPlayerId: martinId }
          - e: Game / PlayerJoined
            props: { playerId: nilsId, playerName: Nils }
          - e: Game / GameStarted
          - e: Game / GuessSubmitted
            props: { playerId: martinId, questionIndex: 0, direction: mer, difference: 30 }
        then:
          - v: State / Game
            props:
              phase: started
              hostPlayerId: martinId
              currentQuestionIndex: 0
              guesses: [martinGuessMer30]
              pendingPlayerIds: [nilsId]
              currentQuestionScored: false
      scoring a question accumulates totals and advances state:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode, hostPlayerId: martinId }
          - e: Game / PlayerJoined
            props: { playerId: nilsId, playerName: Nils }
          - e: Game / GameStarted
          - e: Game / GuessSubmitted
            props: { playerId: martinId, questionIndex: 0, direction: mer, difference: 30 }
          - e: Game / GuessSubmitted
            props: { playerId: nilsId, questionIndex: 0, direction: mindre, difference: 50 }
          - e: Game / QuestionAnswered
            props: { questionIndex: 0, correctDirection: mer, correctDifference: 40 }
          - e: Game / QuestionScored
            props: { playerId: martinId, questionIndex: 0, roundScore: 0, totalScore: 0 }
          - e: Game / QuestionScored
            props: { playerId: nilsId, questionIndex: 0, roundScore: 10, totalScore: 10 }
        then:
          - v: State / Game
            props:
              phase: started
              currentQuestionIndex: 0
              guesses: [martinGuessMer30, nilsGuessMindre50]
              pendingPlayerIds: []
              currentQuestionScored: true
              totalScores: [martinTotal0, nilsTotal10]

  # --- Catalog / Setup -----------------------------------------------------

  # ASSUMPTION: the Quiz catalog is reference data, not on the Game stream.
  # Choosing to play MEM = choosing a question pack (a deck of designated
  # question-cards, e.g. "0-100"). Pack publishing/commerce is out of scope.
  Quiz Catalog:
    - v: Screen / Quiz catalog
      props:
        packs: QuestionPack[]   # { packId: Guid, name: string, questionCount: int }

  # OpenLobby resolves {questionPackId} to a pack via a GameContext dependency
  # (same pattern that stamps gameId/joinCode/createdAt) and snapshots the full
  # question set onto LobbyOpened. The host is the first player (hostPlayerId), so a
  # game is never empty. x: QuestionPackNotFound when the id resolves to no pack.
  #
  # Test fixtures (referenced by name in the cases below):
  #   pack mer-eller-mindre = [ question0, question1 ]  (the default deck)
  #   question0 = Question { questionText: question0, optionA: question0A, optionB: question0B, valueA: 100, valueB: 60 }  # ScoreQuestion derives -> mer,    40
  #   question1 = Question { questionText: question1, optionA: question1A, optionB: question1B, valueA: 80,  valueB: 100 } # ScoreQuestion derives -> mindre, 20
  #   host hostName = Martin ; minted joinCode = joinCode
  Open Lobby:
    steps:
      - t: GameMaster / Quiz catalog
      - c: OpenLobby
        props:
          hostName: string
          questionPackId: Guid
      - x: QuestionPackNotFound
      - e: Game / LobbyOpened
        props:
          gameId: Guid
          hostPlayerId: Guid
          joinCode: Guid
          questionPackId: Guid    # opaque audit reference to the chosen pack
          questions: Question[]   # { questionText: string, optionA: string, optionB: string, valueA: double, valueB: double } — raw values; no precomputed answer
          createdAt: DateTimeOffset
      - v: Screen / Game lobby
    tests:
      game can be created:
        given: []
        when:
          - c: OpenLobby
            props: { hostName: Martin, questionPackId: mer-eller-mindre }
        then:
          - e: Game / LobbyOpened
            props:
              hostPlayerId: hostPlayerId
              joinCode: joinCode
              questionPackId: mer-eller-mindre
              questions: [question0, question1]
              createdAt: createdAt
      cannot open lobby with unknown pack:
        given: []
        when:
          - c: OpenLobby
            props: { questionPackId: unknown }
        then:
          - x: QuestionPackNotFound

  Game Lobby:
    - v: Screen / Game lobby
      props:
        gameId: Guid
        joinCode: Guid
        players: Player[]   # { playerId: Guid, name: string, isHost: bool }

  # JoinGame keys on the minted joinCode from LobbyOpened. A joined player is
  # identified downstream by the playerId minted on PlayerJoined; the join form
  # only carries {joinCode, playerName}. Failures are Result failure-track values
  # (see docs/adr/006), never thrown exceptions:
  #   x: GameNotFound        — joinCode resolves to no open game (empty/unknown stream).
  #   x: GameAlreadyStarted  — the game has started; the lobby no longer accepts joins.
  #   x: NameAlreadyTaken    — see ASSUMPTION below.
  # ASSUMPTION: duplicate joins are detected by playerName within a game (the
  #   command carries no playerId), so NameAlreadyTaken guards a name already
  #   present in the lobby — including the host's name (the GM is the first player).
  Join Game:
    steps:
      - t: Player / Join form
      - c: JoinGame
        props:
          joinCode: Guid
          playerName: string
      - x: GameNotFound
      - x: GameAlreadyStarted
      - x: NameAlreadyTaken
      - e: Game / PlayerJoined
        props:
          gameId: Guid
          playerId: Guid
          playerName: string
          joinedAt: DateTimeOffset
      - v: Screen / Game lobby
    tests:
      player can join lobby:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode }
        when:
          - c: JoinGame
            props: { joinCode: joinCode, playerName: Nils }
        then:
          - e: Game / PlayerJoined
            props: { playerId: playerId, playerName: Nils, joinedAt: joinedAt }
      cannot join nonexistent game:
        given: []
        when:
          - c: JoinGame
            props: { joinCode: unknown, playerName: Nils }
        then:
          - x: GameNotFound
      cannot join started game:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode }
          - e: Game / PlayerJoined
            props: { playerName: Nils }
          - e: Game / GameStarted
        when:
          - c: JoinGame
            props: { joinCode: joinCode, playerName: Sven }
        then:
          - x: GameAlreadyStarted
      cannot join with name already taken:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode }
          - e: Game / PlayerJoined
            props: { playerName: Nils }
        when:
          - c: JoinGame
            props: { joinCode: joinCode, playerName: Nils }
        then:
          - x: NameAlreadyTaken

  # --- Play ----------------------------------------------------------------

  # StartGame presents Q0 by index; the Question read-model resolves card content
  # from the pack. No QuestionPresented event (aligns to the C# domain).
  # Failures are Result failure-track values (see docs/adr/006), never thrown:
  #   x: GameNotFound       — gameId resolves to no open game (empty/unknown stream).
  #   x: NotEnoughPlayers   — see ASSUMPTION below.
  # ASSUMPTION: at least 2 players (the host + >=1 join) are required to start;
  #   otherwise NotEnoughPlayers. GameAlreadyStarted is NOT guarded here (already
  #   guarded on Join Game); host-only (NotGameHost) would need requestingPlayerId
  #   on the command and is deferred.
  Start Game:
    steps:
      - t: GameMaster / Game lobby
      - c: StartGame
        props:
          gameId: Guid
      - x: GameNotFound
      - x: NotEnoughPlayers
      - e: Game / GameStarted
        props:
          gameId: Guid
          firstQuestionIndex: int
          startedAt: DateTimeOffset
      - v: Screen / Question
    tests:
      game can be started:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode }
          - e: Game / PlayerJoined
            props: { playerName: Nils }
        when:
          - c: StartGame
            props: { gameId: gameId }
        then:
          - e: Game / GameStarted
            props: { firstQuestionIndex: 0, startedAt: startedAt }
      cannot start nonexistent game:
        given: []
        when:
          - c: StartGame
            props: { gameId: unknown }
        then:
          - x: GameNotFound
      cannot start without enough players:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode }
        when:
          - c: StartGame
            props: { gameId: gameId }
        then:
          - x: NotEnoughPlayers

  Question:
    - v: Screen / Question
      props:
        gameId: Guid
        questionIndex: int
        totalQuestions: int
        questionText: string
        optionA: string
        optionB: string

  # The Game Master also plays: Martin (id0) submits guesses through this same
  # Player / slice, exactly like Nils (id1) and Sven (id2).
  # Failures are Result failure-track values (see docs/adr/006), never thrown:
  #   x: GameNotFound          — gameId resolves to no game (empty/unknown stream).
  #   x: GameNotStarted        — still in the lobby; no question is presented yet.
  #   x: PlayerNotInGame       — playerId never joined this game.
  #   x: AlreadyGuessed        — this player already guessed the current question.
  #   x: DifferenceOutOfRange  — difference is outside 0-100.
  # NOTE: "invalid direction" is NOT modeled — direction is a typed Direction
  #   (mer|mindre) enum, so an invalid value is unrepresentable in the decider; any
  #   bad input is a web/model-binding concern in the imperative shell, not a slice.
  # The guess targets the current question by folded state, so SubmitGuess carries no
  # questionIndex; GuessSubmitted stamps the resolved questionIndex.
  Submit Guess:
    steps:
      - t: Player / Question
      - c: SubmitGuess
        props:
          gameId: Guid
          playerId: Guid
          direction: Direction (mer|mindre)
          difference: int (0-100)
      - x: GameNotFound
      - x: GameNotStarted
      - x: PlayerNotInGame
      - x: AlreadyGuessed
      - x: DifferenceOutOfRange
      - e: Game / GuessSubmitted
        props:
          gameId: Guid
          playerId: Guid
          questionIndex: int
          direction: Direction (mer|mindre)
          difference: int (0-100)
          submittedAt: DateTimeOffset
      - v: Screen / Waiting for others
    tests:
      guess submitted successfully:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode }
          - e: Game / PlayerJoined
            props: { playerId: playerId, playerName: Nils }
          - e: Game / GameStarted
        when:
          - c: SubmitGuess
            props: { gameId: gameId, playerId: playerId, direction: mer, difference: 30 }
        then:
          - e: Game / GuessSubmitted
            props: { playerId: playerId, questionIndex: 0, direction: mer, difference: 30, submittedAt: submittedAt }
      cannot guess in nonexistent game:
        given: []
        when:
          - c: SubmitGuess
            props: { gameId: unknown, playerId: playerId, direction: mer, difference: 30 }
        then:
          - x: GameNotFound
      cannot guess before game starts:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode }
          - e: Game / PlayerJoined
            props: { playerId: playerId, playerName: Nils }
        when:
          - c: SubmitGuess
            props: { gameId: gameId, playerId: playerId, direction: mer, difference: 30 }
        then:
          - x: GameNotStarted
      cannot guess as non-member:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode }
          - e: Game / PlayerJoined
            props: { playerId: playerId, playerName: Nils }
          - e: Game / GameStarted
        when:
          - c: SubmitGuess
            props: { gameId: gameId, playerId: stranger, direction: mer, difference: 30 }
        then:
          - x: PlayerNotInGame
      cannot guess again on same question:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode }
          - e: Game / PlayerJoined
            props: { playerId: playerId, playerName: Nils }
          - e: Game / GameStarted
          - e: Game / GuessSubmitted
            props: { playerId: playerId, questionIndex: 0 }
        when:
          - c: SubmitGuess
            props: { gameId: gameId, playerId: playerId, direction: mindre, difference: 20 }
        then:
          - x: AlreadyGuessed
      difference out of range rejected:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode }
          - e: Game / PlayerJoined
            props: { playerId: playerId, playerName: Nils }
          - e: Game / GameStarted
        when:
          - c: SubmitGuess
            props: { gameId: gameId, playerId: playerId, direction: mer, difference: 150 }
        then:
          - x: DifferenceOutOfRange

  Waiting For Others:
    - v: Screen / Waiting for others
      props:
        gameId: Guid
        questionIndex: int
        submittedPlayerIds: Guid[]
        pendingPlayerIds: Guid[]

  # --- Scoring (System processor) ------------------------------------------

  # Minimal Todo read-model the scorer's gear observes — only enough to see that a
  # scoring task exists. Lifecycle: GameStarted / NextQuestionStarted OPENS the entry
  # (every joined player pending); each GuessSubmitted CHECKS OFF one player;
  # allGuessesIn = pendingPlayerIds empty (the gate the System / Score question
  # processor fires on); the next NextQuestionStarted reopens it at the new index.
  # The player count is known, so "all guesses in" is a condition here, not an event.
  # SEPARATE from State / Game — re-validation of the gate (QuestionAlreadyScored)
  # lives on State, keeping this list minimal. The GT below proves the projection.
  Outstanding Guesses:
    steps:
      - v: Todo / Outstanding guesses
        props:
          gameId: Guid
          questionIndex: int
          pendingPlayerIds: Guid[]
          allGuessesIn: bool
    tests:
      outstanding guesses open for every player when the game starts:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode, hostPlayerId: martinId }
          - e: Game / PlayerJoined
            props: { playerId: nilsId, playerName: Nils }
          - e: Game / GameStarted
        then:
          - v: Todo / Outstanding guesses
            props: { questionIndex: 0, pendingPlayerIds: [martinId, nilsId], allGuessesIn: false }
      a submitted guess checks off that player:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode, hostPlayerId: martinId }
          - e: Game / PlayerJoined
            props: { playerId: nilsId, playerName: Nils }
          - e: Game / GameStarted
          - e: Game / GuessSubmitted
            props: { playerId: martinId, questionIndex: 0, direction: mer, difference: 30 }
        then:
          - v: Todo / Outstanding guesses
            props: { questionIndex: 0, pendingPlayerIds: [nilsId], allGuessesIn: false }
      all guesses in once every player has guessed:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode, hostPlayerId: martinId }
          - e: Game / PlayerJoined
            props: { playerId: nilsId, playerName: Nils }
          - e: Game / GameStarted
          - e: Game / GuessSubmitted
            props: { playerId: martinId, questionIndex: 0, direction: mer, difference: 30 }
          - e: Game / GuessSubmitted
            props: { playerId: nilsId, questionIndex: 0, direction: mindre, difference: 50 }
        then:
          - v: Todo / Outstanding guesses
            props: { questionIndex: 0, pendingPlayerIds: [], allGuessesIn: true }
      the next question reopens outstanding guesses:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode, hostPlayerId: martinId }
          - e: Game / PlayerJoined
            props: { playerId: nilsId, playerName: Nils }
          - e: Game / GameStarted
          - e: Game / GuessSubmitted
            props: { playerId: martinId, questionIndex: 0, direction: mer, difference: 30 }
          - e: Game / GuessSubmitted
            props: { playerId: nilsId, questionIndex: 0, direction: mindre, difference: 50 }
          - e: Game / QuestionAnswered
            props: { questionIndex: 0, correctDirection: mer, correctDifference: 40 }
          - e: Game / NextQuestionStarted
            props: { questionIndex: 1 }
        then:
          - v: Todo / Outstanding guesses
            props: { questionIndex: 1, pendingPlayerIds: [martinId, nilsId], allGuessesIn: false }

  # Processor: once Outstanding guesses shows allGuessesIn, the System scores.
  # Balances the card's raw valueA/valueB onto 0-100: derives correctDirection (larger
  # value) and correctDifference = |A-B|/max(A,B)*100, revealed once on QuestionAnswered,
  # then emits one QuestionScored per player.
  # Failures are Result failure-track values (see docs/adr/006), never thrown:
  #   x: NotAllGuessesIn        — allGuessesIn is false (a player is still pending).
  #   x: QuestionAlreadyScored  — this question was already revealed/scored (guards a
  #                               double fire of the processor).
  # Because allGuessesIn requires ALL joined players to have guessed, one ScoreQuestion
  # always emits N QuestionScored (one per player) — the happy cases are multi-player.
  # 'lowest score wins' is winner determination and lives on End Game, not here.
  # Fixtures: question0 = {mer, 40}, question1 = {mindre, 20}; host = martinId, Nils = nilsId.
  Score Question:
    steps:
      - e: Game / GuessSubmitted
      - v: Todo / Outstanding guesses
      - t: System / Score question
      - c: ScoreQuestion
        props:
          gameId: Guid
          questionIndex: int
      - x: NotAllGuessesIn
      - x: QuestionAlreadyScored
      - e: Game / QuestionAnswered
        props:
          gameId: Guid
          questionIndex: int
          correctDirection: Direction (mer|mindre)
          correctDifference: int (0-100)
      - e: Game / QuestionScored       # one per player
        props:
          gameId: Guid
          questionIndex: int
          playerId: Guid
          guessedDirection: Direction (mer|mindre)
          guessedDifference: int (0-100)
          directionCorrect: bool
          differencePoints: int
          bonusPoints: int
          roundScore: int
          totalScore: int
      - v: Screen / Round results
    # Decider-true GWT: given the folded State / Game (the props `decide` reads),
    # when ScoreQuestion, then the events | rejection. No event-replay in given —
    # the open->checked-off->scored history is verified by State / Game's and
    # Outstanding Guesses' own GT. allGuessesIn is encoded here as empty pendingPlayerIds.
    tests:
      all guesses scored and answer revealed:
        given:
          - v: State / Game
            props:
              phase: started
              questions: [question0, question1]
              currentQuestionIndex: 0
              guesses: [martinGuessMer30, nilsGuessMindre50]
              pendingPlayerIds: []
              currentQuestionScored: false
              totalScores: []
        when:
          - c: ScoreQuestion
            props: { gameId: gameId, questionIndex: 0 }
        then:
          - e: Game / QuestionAnswered
            props: { questionIndex: 0, correctDirection: mer, correctDifference: 40 }
          - e: Game / QuestionScored
            props: { playerId: martinId, guessedDirection: mer, guessedDifference: 30, directionCorrect: true, differencePoints: 10, bonusPoints: -10, roundScore: 0, totalScore: 0 }
          - e: Game / QuestionScored
            props: { playerId: nilsId, guessedDirection: mindre, guessedDifference: 50, directionCorrect: false, differencePoints: 10, bonusPoints: 0, roundScore: 10, totalScore: 10 }
      exact difference with correct direction:
        given:
          - v: State / Game
            props:
              phase: started
              questions: [question0, question1]
              currentQuestionIndex: 0
              guesses: [martinGuessMer40, nilsGuessMindre50]
              pendingPlayerIds: []
              currentQuestionScored: false
              totalScores: []
        when:
          - c: ScoreQuestion
            props: { gameId: gameId, questionIndex: 0 }
        then:
          - e: Game / QuestionAnswered
            props: { questionIndex: 0, correctDirection: mer, correctDifference: 40 }
          - e: Game / QuestionScored
            props: { playerId: martinId, guessedDirection: mer, guessedDifference: 40, directionCorrect: true, differencePoints: 0, bonusPoints: -10, roundScore: -10, totalScore: -10 }
          - e: Game / QuestionScored
            props: { playerId: nilsId, guessedDirection: mindre, guessedDifference: 50, directionCorrect: false, differencePoints: 10, bonusPoints: 0, roundScore: 10, totalScore: 10 }
      scores accumulate across rounds:
        given:
          - v: State / Game
            props:
              phase: started
              questions: [question0, question1]
              currentQuestionIndex: 1
              guesses: [martinGuessMindre25, nilsGuessMindre20]
              pendingPlayerIds: []
              currentQuestionScored: false
              totalScores: [martinTotal0, nilsTotal10]   # carried in from question0
        when:
          - c: ScoreQuestion
            props: { gameId: gameId, questionIndex: 1 }
        then:
          - e: Game / QuestionAnswered
            props: { questionIndex: 1, correctDirection: mindre, correctDifference: 20 }
          - e: Game / QuestionScored
            props: { playerId: martinId, guessedDifference: 25, directionCorrect: true, differencePoints: 5, bonusPoints: -10, roundScore: -5, totalScore: -5 }
          - e: Game / QuestionScored
            props: { playerId: nilsId, guessedDifference: 20, directionCorrect: true, differencePoints: 0, bonusPoints: -10, roundScore: -10, totalScore: 0 }
      cannot score before all guesses in:
        given:
          - v: State / Game
            props:
              phase: started
              questions: [question0, question1]
              currentQuestionIndex: 0
              guesses: [martinGuessMer30]
              pendingPlayerIds: [nilsId]   # still pending -> gate not open
              currentQuestionScored: false
        when:
          - c: ScoreQuestion
            props: { gameId: gameId, questionIndex: 0 }
        then:
          - x: NotAllGuessesIn
      cannot score an already-scored question:
        given:
          - v: State / Game
            props:
              phase: started
              questions: [question0, question1]
              currentQuestionIndex: 0
              guesses: [martinGuessMer30, nilsGuessMindre50]
              pendingPlayerIds: []
              currentQuestionScored: true   # already revealed/scored -> double fire guarded
        when:
          - c: ScoreQuestion
            props: { gameId: gameId, questionIndex: 0 }
        then:
          - x: QuestionAlreadyScored

  Round Results:
    - v: Screen / Round results
      props:
        gameId: Guid
        questionIndex: int
        correctDirection: Direction (mer|mindre)   # from QuestionAnswered
        correctDifference: int (0-100)             # from QuestionAnswered
        playerScores: PlayerScore[]  # { playerId: Guid, roundScore: int, totalScore: int } from per-player QuestionScored

  # --- Progression (System processor) --------------------------------------

  # Todo read-model the progression processors observe. totalQuestions resolved
  # read-side from the pack (questionPackId stays an opaque reference).
  Game Progress:
    - v: Todo / Game progress
      props:
        gameId: Guid
        questionIndex: int
        totalQuestions: int
        scoredQuestionCount: int
        hasNextQuestion: bool

  # Maps the lilac "möjliggör / ställ nästa fråga" on the board. Fires when
  # Game progress shows hasNextQuestion. Presents the next question by index.
  Ask Next Question:
    - e: Game / QuestionAnswered
    - v: Todo / Game progress
    - t: System / Ask next question
    - c: AskNextQuestion
      props:
        gameId: Guid
    - e: Game / NextQuestionStarted
      props:
        gameId: Guid
        questionIndex: int
    - v: Screen / Question

  # --- End (System processor) ----------------------------------------------

  # Fires when Game progress shows NOT hasNextQuestion (mutually exclusive with
  # AskNextQuestion). Both react to QuestionAnswered.
  End Game:
    - e: Game / QuestionAnswered
    - v: Todo / Game progress
    - t: System / End game
    - c: EndGame
      props:
        gameId: Guid
    - e: Game / GameEnded
      props:
        gameId: Guid
        finalScoreboard: ScoreboardEntry[]   # { playerId: Guid, playerName: string, totalScore: int }
        winnerId: Guid
        endedAt: DateTimeOffset
    - v: Screen / Final standings

  Final Standings:
    - v: Screen / Final standings
      props:
        gameId: Guid
        finalScoreboard: ScoreboardEntry[]   # { playerId: Guid, playerName: string, totalScore: int }
        winnerId: Guid
