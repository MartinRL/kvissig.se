# Mer eller Mindre — Event-Modeling spec for one round ("omgång").
# Transcribed from specs/MEM-omgång.png. See specs/CLAUDE.md for conventions.
#
# Conventions:
#   triggers carry the actor role + originating screen
#                                  (GameMaster / Quiz catalog, Player / Question, System / ...)
#   commands are bare              (OpenLobby, SubmitGuess)
#   events carry the stream        (Game / LobbyOpened)
#   exceptions are bare            (GameNotFound)
#   views carry a view lane        (Screen / Game lobby, Todo / Outstanding guesses)
#
# View lanes:
#   Screen / ...  human screens players & the GM actually see
#   Todo / ...    processor-facing read-models the System observes (never shown)
# NOTE: emlang parses + lints these view-lane prefixes fine, but the diagram renders
#   views by their bare name without a per-view lane label (only triggers and events
#   get a visible swimlane label). The prefix still documents intent and maps to code.
#
# Automations are the Event-Modeling PROCESSOR pattern, not a dedicated element
# (emlang has no cog/gear): event(s) -> Todo read-model -> System trigger -> command
# -> event(s) -> Screen. "All guesses in" is therefore a CONDITION of a todo
# read-model (Todo / Outstanding guesses), not an event.
#
# Scoring (see ScoreQuestion / QuestionScored):
#   roundScore = |guessedDifference - correctDifference| + (directionCorrect ? -10 : 0)
#   lowest total score wins; negative scores possible (exact difference + right
#   direction = -10, the best possible round).
#
#   The difference is a NORMALIZED 0-100 number, never a raw gap. Picture the two
#   answers as two bars side by side; the difference is how much taller the tall bar
#   is, as a share of the tall bar itself:
#     equal bars            -> 0
#     short bar = half tall -> 50
#     short bar = a tenth   -> 90
#     short bar ~ nothing   -> near 100
#   So correctDifference = |A-B| / max(A,B) * 100. This deliberately compresses large
#   ratios (2x->50, 10x->90, 100x->99): small differences are the fun ones to pin
#   down, giant ones are obviously giant. Simplicity is the guiding star.
#   For quantities already measured on a multiplicative scale (decibel, Richter, pH),
#   normalize the scale values themselves, not the raw underlying amounts.
#
#   correctDirection/correctDifference are revealed once per question on
#   Game / QuestionAnswered; per-player scoring is one Game / QuestionScored each.
#
# ASSUMPTION: the board's two guess screens (direction, then difference) are modeled
# as a single SubmitGuess {direction, difference} command, matching the C# domain.
# Split into two commands only if the board later demands it.
#
# ASSUMPTION: question-card content (text/options/answers) is snapshotted onto
# Game / LobbyOpened (questions: Question[]). OpenLobby resolves the chosen pack via a
# GameContext dependency and stamps the full question set, so read models read events
# only. Screen / Question reads card text/options by index from folded state;
# totalQuestions = questions.Count; the per-question reveal (correctDirection/
# correctDifference) is computed by the decider from that same LobbyOpened state.
#
# Prop types (these annotations ARE the intended C# types; see specs/CLAUDE.md):
#   ids                    Guid          (gameId, playerId, hostPlayerId, winnerId,
#                                         questionPackId, packId, joinCode, and *PlayerIds[])
#   timestamps (*At)       DateTimeOffset
#   direction              Direction (mer|mindre)  — enum
#   difference family      int (0-100)   (difference, correctDifference, guessedDifference)
#   points/scores          int           (may be negative per scoring rule)
#   index/count            int

slices:

  # --- Catalog / Setup -----------------------------------------------------

  # ASSUMPTION: the Quiz catalog is reference data, not on the Game stream.
  # Choosing to play MEM = choosing a question pack (a deck of designated
  # question-cards, e.g. "0-100"). Pack publishing/commerce is out of scope.
  Quiz Catalog:
    - v: Screen / Quiz catalog
      props:
        packs: QuestionPack[]   # { packId: Guid, name: string, questionCount: int }

  # OpenLobby resolves {questionPackId} to a pack via a GameContext dependency
  # (same pattern that stamps gameId/joinCode/createdAt) and snapshots the full
  # question set onto LobbyOpened. The host is the first player (hostPlayerId), so a
  # game is never empty. x: QuestionPackNotFound when the id resolves to no pack.
  #
  # Test fixtures (referenced by name in the cases below):
  #   pack mer-eller-mindre = [ question0, question1 ]  (the default deck)
  #   question0 = Question { questionText: question0, optionA: question0A, optionB: question0B, correctDirection: mer,    correctDifference: 40 }
  #   question1 = Question { questionText: question1, optionA: question1A, optionB: question1B, correctDirection: mindre, correctDifference: 20 }
  #   host hostName = Martin ; minted joinCode = joinCode
  Open Lobby:
    steps:
      - t: GameMaster / Quiz catalog
      - c: OpenLobby
        props:
          hostName: string
          questionPackId: Guid
      - x: QuestionPackNotFound
      - e: Game / LobbyOpened
        props:
          gameId: Guid
          hostPlayerId: Guid
          joinCode: Guid
          questionPackId: Guid    # opaque audit reference to the chosen pack
          questions: Question[]   # { questionText: string, optionA: string, optionB: string, correctDirection: Direction (mer|mindre), correctDifference: int (0-100) }
          createdAt: DateTimeOffset
      - v: Screen / Game lobby
    tests:
      game can be created:
        given: []
        when:
          - c: OpenLobby
            props: { hostName: Martin, questionPackId: mer-eller-mindre }
        then:
          - e: Game / LobbyOpened
            props:
              hostPlayerId: hostPlayerId
              joinCode: joinCode
              questionPackId: mer-eller-mindre
              questions: [question0, question1]
              createdAt: createdAt
      cannot open lobby with unknown pack:
        given: []
        when:
          - c: OpenLobby
            props: { questionPackId: unknown }
        then:
          - x: QuestionPackNotFound

  Game Lobby:
    - v: Screen / Game lobby
      props:
        gameId: Guid
        joinCode: Guid
        players: Player[]   # { playerId: Guid, name: string, isHost: bool }

  # JoinGame keys on the minted joinCode from LobbyOpened. A joined player is
  # identified downstream by the playerId minted on PlayerJoined; the join form
  # only carries {joinCode, playerName}. Failures are Result failure-track values
  # (see docs/adr/006), never thrown exceptions:
  #   x: GameNotFound        — joinCode resolves to no open game (empty/unknown stream).
  #   x: GameAlreadyStarted  — the game has started; the lobby no longer accepts joins.
  #   x: NameAlreadyTaken    — see ASSUMPTION below.
  # ASSUMPTION: duplicate joins are detected by playerName within a game (the
  #   command carries no playerId), so NameAlreadyTaken guards a name already
  #   present in the lobby — including the host's name (the GM is the first player).
  Join Game:
    steps:
      - t: Player / Join form
      - c: JoinGame
        props:
          joinCode: Guid
          playerName: string
      - x: GameNotFound
      - x: GameAlreadyStarted
      - x: NameAlreadyTaken
      - e: Game / PlayerJoined
        props:
          gameId: Guid
          playerId: Guid
          playerName: string
          joinedAt: DateTimeOffset
      - v: Screen / Game lobby
    tests:
      player can join lobby:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode }
        when:
          - c: JoinGame
            props: { joinCode: joinCode, playerName: Nils }
        then:
          - e: Game / PlayerJoined
            props: { playerId: playerId, playerName: Nils, joinedAt: joinedAt }
      cannot join nonexistent game:
        given: []
        when:
          - c: JoinGame
            props: { joinCode: unknown, playerName: Nils }
        then:
          - x: GameNotFound
      cannot join started game:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode }
          - e: Game / PlayerJoined
            props: { playerName: Nils }
          - e: Game / GameStarted
        when:
          - c: JoinGame
            props: { joinCode: joinCode, playerName: Sven }
        then:
          - x: GameAlreadyStarted
      cannot join with name already taken:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode }
          - e: Game / PlayerJoined
            props: { playerName: Nils }
        when:
          - c: JoinGame
            props: { joinCode: joinCode, playerName: Nils }
        then:
          - x: NameAlreadyTaken

  # --- Play ----------------------------------------------------------------

  # StartGame presents Q0 by index; the Question read-model resolves card content
  # from the pack. No QuestionPresented event (aligns to the C# domain).
  # Failures are Result failure-track values (see docs/adr/006), never thrown:
  #   x: GameNotFound       — gameId resolves to no open game (empty/unknown stream).
  #   x: NotEnoughPlayers   — see ASSUMPTION below.
  # ASSUMPTION: at least 2 players (the host + >=1 join) are required to start;
  #   otherwise NotEnoughPlayers. GameAlreadyStarted is NOT guarded here (already
  #   guarded on Join Game); host-only (NotGameHost) would need requestingPlayerId
  #   on the command and is deferred.
  Start Game:
    steps:
      - t: GameMaster / Game lobby
      - c: StartGame
        props:
          gameId: Guid
      - x: GameNotFound
      - x: NotEnoughPlayers
      - e: Game / GameStarted
        props:
          gameId: Guid
          firstQuestionIndex: int
          startedAt: DateTimeOffset
      - v: Screen / Question
    tests:
      game can be started:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode }
          - e: Game / PlayerJoined
            props: { playerName: Nils }
        when:
          - c: StartGame
            props: { gameId: gameId }
        then:
          - e: Game / GameStarted
            props: { firstQuestionIndex: 0, startedAt: startedAt }
      cannot start nonexistent game:
        given: []
        when:
          - c: StartGame
            props: { gameId: unknown }
        then:
          - x: GameNotFound
      cannot start without enough players:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode }
        when:
          - c: StartGame
            props: { gameId: gameId }
        then:
          - x: NotEnoughPlayers

  Question:
    - v: Screen / Question
      props:
        gameId: Guid
        questionIndex: int
        totalQuestions: int
        questionText: string
        optionA: string
        optionB: string

  # The Game Master also plays: Martin (id0) submits guesses through this same
  # Player / slice, exactly like Nils (id1) and Sven (id2).
  # Failures are Result failure-track values (see docs/adr/006), never thrown:
  #   x: GameNotFound          — gameId resolves to no game (empty/unknown stream).
  #   x: GameNotStarted        — still in the lobby; no question is presented yet.
  #   x: PlayerNotInGame       — playerId never joined this game.
  #   x: AlreadyGuessed        — this player already guessed the current question.
  #   x: DifferenceOutOfRange  — difference is outside 0-100.
  # NOTE: "invalid direction" is NOT modeled — direction is a typed Direction
  #   (mer|mindre) enum, so an invalid value is unrepresentable in the decider; any
  #   bad input is a web/model-binding concern in the imperative shell, not a slice.
  # The guess targets the current question by folded state, so SubmitGuess carries no
  # questionIndex; GuessSubmitted stamps the resolved questionIndex.
  Submit Guess:
    steps:
      - t: Player / Question
      - c: SubmitGuess
        props:
          gameId: Guid
          playerId: Guid
          direction: Direction (mer|mindre)
          difference: int (0-100)
      - x: GameNotFound
      - x: GameNotStarted
      - x: PlayerNotInGame
      - x: AlreadyGuessed
      - x: DifferenceOutOfRange
      - e: Game / GuessSubmitted
        props:
          gameId: Guid
          playerId: Guid
          questionIndex: int
          direction: Direction (mer|mindre)
          difference: int (0-100)
          submittedAt: DateTimeOffset
      - v: Screen / Waiting for others
    tests:
      guess submitted successfully:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode }
          - e: Game / PlayerJoined
            props: { playerId: playerId, playerName: Nils }
          - e: Game / GameStarted
        when:
          - c: SubmitGuess
            props: { gameId: gameId, playerId: playerId, direction: mer, difference: 30 }
        then:
          - e: Game / GuessSubmitted
            props: { playerId: playerId, questionIndex: 0, direction: mer, difference: 30, submittedAt: submittedAt }
      cannot guess in nonexistent game:
        given: []
        when:
          - c: SubmitGuess
            props: { gameId: unknown, playerId: playerId, direction: mer, difference: 30 }
        then:
          - x: GameNotFound
      cannot guess before game starts:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode }
          - e: Game / PlayerJoined
            props: { playerId: playerId, playerName: Nils }
        when:
          - c: SubmitGuess
            props: { gameId: gameId, playerId: playerId, direction: mer, difference: 30 }
        then:
          - x: GameNotStarted
      cannot guess as non-member:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode }
          - e: Game / PlayerJoined
            props: { playerId: playerId, playerName: Nils }
          - e: Game / GameStarted
        when:
          - c: SubmitGuess
            props: { gameId: gameId, playerId: stranger, direction: mer, difference: 30 }
        then:
          - x: PlayerNotInGame
      cannot guess again on same question:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode }
          - e: Game / PlayerJoined
            props: { playerId: playerId, playerName: Nils }
          - e: Game / GameStarted
          - e: Game / GuessSubmitted
            props: { playerId: playerId, questionIndex: 0 }
        when:
          - c: SubmitGuess
            props: { gameId: gameId, playerId: playerId, direction: mindre, difference: 20 }
        then:
          - x: AlreadyGuessed
      difference out of range rejected:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode }
          - e: Game / PlayerJoined
            props: { playerId: playerId, playerName: Nils }
          - e: Game / GameStarted
        when:
          - c: SubmitGuess
            props: { gameId: gameId, playerId: playerId, direction: mer, difference: 150 }
        then:
          - x: DifferenceOutOfRange

  Waiting For Others:
    - v: Screen / Waiting for others
      props:
        gameId: Guid
        questionIndex: int
        submittedPlayerIds: Guid[]
        pendingPlayerIds: Guid[]

  # --- Scoring (System processor) ------------------------------------------

  # Todo read-model the scorer observes. ASSUMPTION: derived from PlayerJoined
  # minus per-question GuessSubmitted; allGuessesIn = pendingPlayerIds empty.
  # The player count is known, so "all guesses in" is a condition here, not an event.
  Outstanding Guesses:
    - v: Todo / Outstanding guesses
      props:
        gameId: Guid
        questionIndex: int
        pendingPlayerIds: Guid[]
        allGuessesIn: bool

  # Processor: once Outstanding guesses shows allGuessesIn, the System scores.
  # Reveals the answer once (QuestionAnswered) and emits one QuestionScored per player.
  # Failures are Result failure-track values (see docs/adr/006), never thrown:
  #   x: NotAllGuessesIn        — allGuessesIn is false (a player is still pending).
  #   x: QuestionAlreadyScored  — this question was already revealed/scored (guards a
  #                               double fire of the processor).
  # Because allGuessesIn requires ALL joined players to have guessed, one ScoreQuestion
  # always emits N QuestionScored (one per player) — the happy cases are multi-player.
  # 'lowest score wins' is winner determination and lives on End Game, not here.
  # Fixtures: question0 = {mer, 40}, question1 = {mindre, 20}; host = martinId, Nils = nilsId.
  Score Question:
    steps:
      - e: Game / GuessSubmitted
      - v: Todo / Outstanding guesses
      - t: System / Score question
      - c: ScoreQuestion
        props:
          gameId: Guid
          questionIndex: int
      - x: NotAllGuessesIn
      - x: QuestionAlreadyScored
      - e: Game / QuestionAnswered
        props:
          gameId: Guid
          questionIndex: int
          correctDirection: Direction (mer|mindre)
          correctDifference: int (0-100)
      - e: Game / QuestionScored       # one per player
        props:
          gameId: Guid
          questionIndex: int
          playerId: Guid
          guessedDirection: Direction (mer|mindre)
          guessedDifference: int (0-100)
          directionCorrect: bool
          differencePoints: int
          bonusPoints: int
          roundScore: int
          totalScore: int
      - v: Screen / Round results
    tests:
      all guesses scored and answer revealed:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode, hostPlayerId: martinId }
          - e: Game / PlayerJoined
            props: { playerId: nilsId, playerName: Nils }
          - e: Game / GameStarted
          - e: Game / GuessSubmitted
            props: { playerId: martinId, questionIndex: 0, direction: mer, difference: 30 }
          - e: Game / GuessSubmitted
            props: { playerId: nilsId, questionIndex: 0, direction: mindre, difference: 50 }
        when:
          - c: ScoreQuestion
            props: { gameId: gameId, questionIndex: 0 }
        then:
          - e: Game / QuestionAnswered
            props: { questionIndex: 0, correctDirection: mer, correctDifference: 40 }
          - e: Game / QuestionScored
            props: { playerId: martinId, guessedDirection: mer, guessedDifference: 30, directionCorrect: true, differencePoints: 10, bonusPoints: -10, roundScore: 0, totalScore: 0 }
          - e: Game / QuestionScored
            props: { playerId: nilsId, guessedDirection: mindre, guessedDifference: 50, directionCorrect: false, differencePoints: 10, bonusPoints: 0, roundScore: 10, totalScore: 10 }
      exact difference with correct direction:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode, hostPlayerId: martinId }
          - e: Game / PlayerJoined
            props: { playerId: nilsId, playerName: Nils }
          - e: Game / GameStarted
          - e: Game / GuessSubmitted
            props: { playerId: martinId, questionIndex: 0, direction: mer, difference: 40 }
          - e: Game / GuessSubmitted
            props: { playerId: nilsId, questionIndex: 0, direction: mindre, difference: 50 }
        when:
          - c: ScoreQuestion
            props: { gameId: gameId, questionIndex: 0 }
        then:
          - e: Game / QuestionAnswered
            props: { questionIndex: 0, correctDirection: mer, correctDifference: 40 }
          - e: Game / QuestionScored
            props: { playerId: martinId, guessedDirection: mer, guessedDifference: 40, directionCorrect: true, differencePoints: 0, bonusPoints: -10, roundScore: -10, totalScore: -10 }
          - e: Game / QuestionScored
            props: { playerId: nilsId, guessedDirection: mindre, guessedDifference: 50, directionCorrect: false, differencePoints: 10, bonusPoints: 0, roundScore: 10, totalScore: 10 }
      scores accumulate across rounds:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode, hostPlayerId: martinId }
          - e: Game / PlayerJoined
            props: { playerId: nilsId, playerName: Nils }
          - e: Game / GameStarted
          - e: Game / GuessSubmitted
            props: { playerId: martinId, questionIndex: 0, direction: mer, difference: 30 }
          - e: Game / GuessSubmitted
            props: { playerId: nilsId, questionIndex: 0, direction: mindre, difference: 50 }
          - e: Game / QuestionAnswered
            props: { questionIndex: 0, correctDirection: mer, correctDifference: 40 }
          - e: Game / QuestionScored
            props: { playerId: martinId, questionIndex: 0, roundScore: 0, totalScore: 0 }
          - e: Game / QuestionScored
            props: { playerId: nilsId, questionIndex: 0, roundScore: 10, totalScore: 10 }
          - e: Game / NextQuestionStarted
            props: { questionIndex: 1 }
          - e: Game / GuessSubmitted
            props: { playerId: martinId, questionIndex: 1, direction: mindre, difference: 25 }
          - e: Game / GuessSubmitted
            props: { playerId: nilsId, questionIndex: 1, direction: mindre, difference: 20 }
        when:
          - c: ScoreQuestion
            props: { gameId: gameId, questionIndex: 1 }
        then:
          - e: Game / QuestionAnswered
            props: { questionIndex: 1, correctDirection: mindre, correctDifference: 20 }
          - e: Game / QuestionScored
            props: { playerId: martinId, guessedDifference: 25, directionCorrect: true, differencePoints: 5, bonusPoints: -10, roundScore: -5, totalScore: -5 }
          - e: Game / QuestionScored
            props: { playerId: nilsId, guessedDifference: 20, directionCorrect: true, differencePoints: 0, bonusPoints: -10, roundScore: -10, totalScore: 0 }
      cannot score before all guesses in:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode, hostPlayerId: martinId }
          - e: Game / PlayerJoined
            props: { playerId: nilsId, playerName: Nils }
          - e: Game / GameStarted
          - e: Game / GuessSubmitted
            props: { playerId: martinId, questionIndex: 0, direction: mer, difference: 30 }
        when:
          - c: ScoreQuestion
            props: { gameId: gameId, questionIndex: 0 }
        then:
          - x: NotAllGuessesIn
      cannot score an already-scored question:
        given:
          - e: Game / LobbyOpened
            props: { joinCode: joinCode, hostPlayerId: martinId }
          - e: Game / PlayerJoined
            props: { playerId: nilsId, playerName: Nils }
          - e: Game / GameStarted
          - e: Game / GuessSubmitted
            props: { playerId: martinId, questionIndex: 0, direction: mer, difference: 30 }
          - e: Game / GuessSubmitted
            props: { playerId: nilsId, questionIndex: 0, direction: mindre, difference: 50 }
          - e: Game / QuestionAnswered
            props: { questionIndex: 0, correctDirection: mer, correctDifference: 40 }
          - e: Game / QuestionScored
            props: { playerId: martinId, questionIndex: 0 }
          - e: Game / QuestionScored
            props: { playerId: nilsId, questionIndex: 0 }
        when:
          - c: ScoreQuestion
            props: { gameId: gameId, questionIndex: 0 }
        then:
          - x: QuestionAlreadyScored

  Round Results:
    - v: Screen / Round results
      props:
        gameId: Guid
        questionIndex: int
        correctDirection: Direction (mer|mindre)   # from QuestionAnswered
        correctDifference: int (0-100)             # from QuestionAnswered
        playerScores: PlayerScore[]  # { playerId: Guid, roundScore: int, totalScore: int } from per-player QuestionScored

  # --- Progression (System processor) --------------------------------------

  # Todo read-model the progression processors observe. totalQuestions resolved
  # read-side from the pack (questionPackId stays an opaque reference).
  Game Progress:
    - v: Todo / Game progress
      props:
        gameId: Guid
        questionIndex: int
        totalQuestions: int
        scoredQuestionCount: int
        hasNextQuestion: bool

  # Maps the lilac "möjliggör / ställ nästa fråga" on the board. Fires when
  # Game progress shows hasNextQuestion. Presents the next question by index.
  Ask Next Question:
    - e: Game / QuestionAnswered
    - v: Todo / Game progress
    - t: System / Ask next question
    - c: AskNextQuestion
      props:
        gameId: Guid
    - e: Game / NextQuestionStarted
      props:
        gameId: Guid
        questionIndex: int
    - v: Screen / Question

  # --- End (System processor) ----------------------------------------------

  # Fires when Game progress shows NOT hasNextQuestion (mutually exclusive with
  # AskNextQuestion). Both react to QuestionAnswered.
  End Game:
    - e: Game / QuestionAnswered
    - v: Todo / Game progress
    - t: System / End game
    - c: EndGame
      props:
        gameId: Guid
    - e: Game / GameEnded
      props:
        gameId: Guid
        finalScoreboard: ScoreboardEntry[]   # { playerId: Guid, playerName: string, totalScore: int }
        winnerId: Guid
        endedAt: DateTimeOffset
    - v: Screen / Final standings

  Final Standings:
    - v: Screen / Final standings
      props:
        gameId: Guid
        finalScoreboard: ScoreboardEntry[]   # { playerId: Guid, playerName: string, totalScore: int }
        winnerId: Guid
