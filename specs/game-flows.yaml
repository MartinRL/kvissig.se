# Mer eller Mindre — Event-Modeling spec for one round ("omgång").
# Transcribed from specs/MEM-omgång.png. See specs/CLAUDE.md for conventions.
#
# Conventions:
#   triggers carry the actor role + originating screen
#                                  (GameMaster / Quiz catalog, Player / Question, System / ...)
#   commands are bare              (OpenLobby, SubmitGuess)
#   events carry the stream        (Game / LobbyOpened)
#   exceptions & views are bare    (GameNotFound, Game lobby)
#
# Scoring (see ScoreQuestion / QuestionScored):
#   roundScore = |guessedDifference - correctDifference| + (directionCorrect ? -10 : 0)
#   difference is normalized 0-100; lowest total score wins; negative scores possible.
#
# ASSUMPTION: the board's two guess screens (direction, then difference) are modeled
# as a single SubmitGuess {direction, difference} command, matching the C# domain.
# Split into two commands only if the board later demands it.
#
# ASSUMPTION: question-card content (text/options) is NOT carried on events. The
# Question read-model derives card text and options from the chosen question pack by
# index. Events carry only the index that advances play.

slices:

  # --- Catalog / setup -----------------------------------------------------

  # ASSUMPTION: the Quiz catalog is reference data, not on the Game stream.
  # Choosing to play MEM = choosing a question pack (a deck of designated
  # question-cards, e.g. "0-100"). Pack publishing/commerce is out of scope.
  QuizCatalog:
    - v: Quiz catalog
      props:
        packs: QuestionPack[]   # { packId, name, questionCount }

  OpenLobby:
    - t: GameMaster / Quiz catalog
    - c: OpenLobby
      props:
        hostName: string
        questionPackId: string
    - e: Game / LobbyOpened
      props:
        gameId: string
        hostPlayerId: string
        joinCode: string
        questionPackId: string
        createdAt: timestamp
    - v: Game lobby

  GameLobby:
    - v: Game lobby
      props:
        gameId: string
        joinCode: string
        players: Player[]

  JoinGame:
    - t: Player / Join form
    - c: JoinGame
      props:
        joinCode: string
        playerName: string
    - e: Game / PlayerJoined
      props:
        gameId: string
        playerId: string
        playerName: string
        joinedAt: timestamp
    - v: Game lobby

  # --- Play ----------------------------------------------------------------

  # StartGame presents Q0 by index; the Question read-model resolves card content
  # from the pack. No QuestionPresented event (aligns to the C# domain).
  StartGame:
    - t: GameMaster / Game lobby
    - c: StartGame
      props:
        gameId: string
    - e: Game / GameStarted
      props:
        gameId: string
        firstQuestionIndex: int
        startedAt: timestamp
    - v: Question

  Question:
    - v: Question
      props:
        gameId: string
        questionIndex: int
        totalQuestions: int
        questionText: string
        optionA: string
        optionB: string

  # The Game Master also plays: Martin (id0) submits guesses through this same
  # Player / slice, exactly like Nils (id1) and Sven (id2).
  SubmitGuess:
    - t: Player / Question
    - c: SubmitGuess
      props:
        gameId: string
        playerId: string
        direction: mer|mindre
        difference: int 0-100
    - e: Game / GuessSubmitted
      props:
        gameId: string
        playerId: string
        questionIndex: int
        direction: string
        difference: int
        submittedAt: timestamp
    - v: Waiting for others

  WaitingForOthers:
    - v: Waiting for others
      props:
        gameId: string
        questionIndex: int
        submittedPlayerIds: string[]
        pendingPlayerIds: string[]

  # --- Scoring (System) ----------------------------------------------------

  # Policy: once the last outstanding GuessSubmitted lands, the System scores.
  ScoreQuestion:
    - e: Game / GuessSubmitted
    - t: System / All guesses in
    - c: ScoreQuestion
      props:
        gameId: string
        questionIndex: int
    - e: Game / AllGuessesSubmitted
      props:
        gameId: string
        questionIndex: int
    - e: Game / QuestionScored
      props:
        gameId: string
        questionIndex: int
        correctDirection: string
        correctDifference: int
        playerScores: PlayerScore[]
    - v: Round results

  RoundResults:
    - v: Round results
      props:
        gameId: string
        questionIndex: int
        correctDirection: string
        correctDifference: int
        playerScores: PlayerScore[]

  # --- Progression (System) ------------------------------------------------

  # Maps the lilac "möjliggör / ställ nästa fråga" on the board. Presents the next
  # question by index; the Question read-model resolves card content from the pack.
  AskNextQuestion:
    - e: Game / QuestionScored
    - t: System / Next question
    - c: AskNextQuestion
      props:
        gameId: string
    - e: Game / NextQuestionStarted
      props:
        gameId: string
        questionIndex: int
    - v: Question

  # --- End (System) --------------------------------------------------------

  EndGame:
    - e: Game / QuestionScored
    - t: System / Last question
    - c: EndGame
      props:
        gameId: string
    - e: Game / GameEnded
      props:
        gameId: string
        finalScoreboard: ScoreboardEntry[]
        winnerId: string
        endedAt: timestamp
    - v: Final standings

  FinalStandings:
    - v: Final standings
      props:
        gameId: string
        finalScoreboard: ScoreboardEntry[]
        winnerId: string
