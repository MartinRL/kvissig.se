<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tänk Till Tusen – Lös v2: Räknartejp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fff7ec; --bg-2: #ffeccf; --ink: #2b2118; --ink-soft: #7a6a58;
      --card: #fffdf9; --line: #f0e0c8; --accent: #ff5d73; --good: #12805c;
      --radius: 22px; --shadow: 0 10px 24px -12px rgba(120,80,20,.45);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: 'Nunito', system-ui, sans-serif; color: var(--ink);
      background: radial-gradient(120% 80% at 50% -10%, var(--bg-2), transparent 60%), var(--bg);
      min-height: 100vh; -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 520px; margin-inline: auto; padding: 1.25rem 1.1rem 3rem; }
    .brand { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .logo { font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 1.35rem; }
    .pill { font-family: 'Baloo 2', cursive; font-weight: 700; font-size: .8rem;
      background: var(--ink); color: var(--bg); padding: .35rem .8rem; border-radius: 999px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 1.35rem 1.2rem; margin-bottom: 1.25rem; }

    .toprow { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .clock { font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 1.15rem;
      background: var(--bg-2); color: var(--ink); padding: .3rem .8rem; border-radius: 999px; }
    .clock.low { background: var(--accent); color: #fff; }
    .target { text-align: center; margin: 0 0 1rem; }
    .target .lbl { font-family: 'Baloo 2', cursive; color: var(--ink-soft); font-size: .9rem; }
    .target .num { font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 3rem; line-height: 1; color: var(--accent); }

    .tape { background: var(--bg); border: 2px dashed var(--line); border-radius: 16px;
      padding: .8rem 1rem; min-height: 4.5rem; margin-bottom: 1rem; font-variant-numeric: tabular-nums; }
    .tape .line { font-family: 'Baloo 2', cursive; font-weight: 700; font-size: 1.15rem; padding: .15rem 0; }
    .tape .line .eq { color: var(--good); }
    .tape .empty { color: var(--line); font-size: 1rem; }
    .tape .cur { color: var(--accent); }

    .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; margin-bottom: .8rem; }
    .tile { appearance: none; cursor: pointer; border: 2px solid var(--line); background: var(--bg);
      border-radius: 14px; padding: .85rem .5rem; font-family: 'Baloo 2', cursive; font-weight: 800;
      font-size: 1.5rem; color: var(--ink); transition: transform .1s, opacity .12s, border-color .12s; }
    .tile:active { transform: scale(.95); }
    .tile.used { opacity: .28; pointer-events: none; }
    .tile.sel { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(255,93,115,.18); }
    .tile.res { border-style: dashed; border-color: var(--good); color: var(--good); }

    .ops { display: grid; grid-template-columns: repeat(4, 1fr); gap: .6rem; }
    .op { appearance: none; cursor: pointer; border: 2px solid var(--line); background: var(--bg-2);
      border-radius: 14px; padding: .8rem; font-family: 'Baloo 2', cursive; font-weight: 800;
      font-size: 1.4rem; color: var(--ink); }
    .op.sel { background: var(--accent); color: #fff; border-color: var(--accent); }
    .op:active { transform: scale(.94); }

    .status { text-align: center; min-height: 1.3rem; margin: .9rem 0 0; color: var(--ink-soft); font-size: .95rem; }
    .row { display: flex; gap: .6rem; margin-top: 1rem; }
    .undo { flex: 0 0 auto; cursor: pointer; border: 2px solid var(--line); background: var(--bg);
      border-radius: 14px; padding: .9rem 1.1rem; font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 1.1rem; }
    .submit { flex: 1; appearance: none; cursor: pointer; border: none; border-radius: 14px; padding: .95rem;
      font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 1.1rem; color: #fff;
      background: linear-gradient(135deg, var(--accent), #ff8a3d); box-shadow: 0 10px 22px -8px rgba(255,93,115,.7); }
    .submit:active { transform: scale(.98); }
    .back { display: block; text-align: center; margin-top: 1.25rem; color: var(--ink-soft); font-size: .85rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="logo">Tänk Till <span style="color:var(--accent)">Tusen</span></div>
      <span class="pill">v2 · Räknartejp</span>
    </div>

    <div class="card">
      <div class="toprow">
        <span class="pill" style="background:var(--bg-2);color:var(--ink-soft)">Pussel 3 / 5</span>
        <span class="clock" id="clock">0:45</span>
      </div>

      <div class="target">
        <div class="lbl">Nå så nära du kan</div>
        <div class="num">812</div>
      </div>

      <div class="tape" id="tape"></div>
      <div class="tiles" id="tiles"></div>
      <div class="ops" id="ops"></div>

      <p class="status" id="status">Tryck ett tal, ett räknesätt, sen ett tal till. Varje rad blir ett nytt tal.</p>

      <div class="row">
        <button type="button" class="undo" id="undo">⌫</button>
        <button type="button" class="submit" id="submit">Lås svar!</button>
      </div>
    </div>

    <a class="back" href="solve-compare.html">← Tillbaka till jämförelsen</a>
  </div>

  <script>
    const TARGET = 812;
    const START = [50, 75, 3, 8, 2, 10];
    const OPS = [['+', (a,b)=>a+b], ['−', (a,b)=>a-b], ['×', (a,b)=>a*b], ['÷', (a,b)=>a/b]];

    let ops = START.map(v => ({ val: v, used: false }));
    let lines = [];   // finished steps: {a, op, b, res}
    let selTile = null, selOp = null;

    const tapeEl = document.getElementById('tape');
    const tilesEl = document.getElementById('tiles');
    const opsEl = document.getElementById('ops');
    const statusEl = document.getElementById('status');

    OPS.forEach(([sym], i) => {
      const b = document.createElement('button');
      b.className = 'op'; b.textContent = sym; b.dataset.op = i;
      b.onclick = () => { selOp = (selOp === i ? null : i); render(); };
      opsEl.appendChild(b);
    });

    function clickTile(i) {
      if (ops[i].used) return;
      if (selTile === null) { selTile = i; render(); return; }
      if (selTile === i) { selTile = null; render(); return; }
      if (selOp === null) { selTile = i; render(); return; }
      const a = ops[selTile].val, b = ops[i].val;
      const res = OPS[selOp][1](a, b);
      if (!Number.isInteger(res) || res <= 0) {
        statusEl.textContent = 'Ogiltigt: resultatet måste bli ett positivt heltal.';
        selOp = null; render(); return;
      }
      ops[selTile].used = true; ops[i].used = true;
      ops.push({ val: res, used: false });
      lines.push({ a, sym: OPS[selOp][0], b, res });
      selTile = null; selOp = null;
      statusEl.textContent = 'Resultatet blev ett nytt tal du kan bygga vidare på.';
      render();
    }

    document.getElementById('undo').onclick = () => {
      const last = lines.pop();
      if (!last) { selTile = null; selOp = null; render(); return; }
      ops.pop();
      // free the two operands that produced it (last two marked used before the result)
      let freed = 0;
      for (let i = ops.length - 1; i >= 0 && freed < 2; i--) { if (ops[i].used) { ops[i].used = false; freed++; } }
      selTile = null; selOp = null;
      statusEl.textContent = 'Rev senaste raden.';
      render();
    };

    document.getElementById('submit').onclick = () => {
      const v = lines.length ? lines[lines.length - 1].res : '–';
      alert('Låst svar: ' + v + ' (mål 812). Nu väntar vi på de andra.');
    };

    function render() {
      // tape
      tapeEl.innerHTML = '';
      if (!lines.length && selTile === null) {
        tapeEl.innerHTML = '<div class="empty">Tejpen är tom…</div>';
      } else {
        lines.forEach(l => {
          const d = document.createElement('div');
          d.className = 'line';
          d.innerHTML = `${l.a} ${l.sym} ${l.b} <span class="eq">= ${l.res}</span>`;
          tapeEl.appendChild(d);
        });
        if (selTile !== null) {
          const d = document.createElement('div');
          d.className = 'line cur';
          const opSym = selOp !== null ? OPS[selOp][0] : '…';
          d.textContent = `${ops[selTile].val} ${opSym} …`;
          tapeEl.appendChild(d);
        }
      }
      // tiles
      tilesEl.innerHTML = '';
      ops.forEach((o, i) => {
        const b = document.createElement('button');
        let cls = 'tile';
        if (o.used) cls += ' used';
        if (i === selTile) cls += ' sel';
        if (i >= START.length) cls += ' res';
        b.className = cls; b.textContent = o.val;
        b.onclick = () => clickTile(i);
        tilesEl.appendChild(b);
      });
      [...opsEl.children].forEach((b, i) => b.classList.toggle('sel', i === selOp));
    }
    render();

    // cosmetic 45s countdown – server owns the real deadline
    let t = 45;
    const clock = document.getElementById('clock');
    setInterval(() => {
      if (t <= 0) return;
      t--;
      clock.textContent = '0:' + String(t).padStart(2, '0');
      clock.classList.toggle('low', t <= 10);
      if (t === 0) { clock.textContent = '0:00'; statusEl.textContent = 'Tiden är ute! Ditt sista tal skickas in.'; }
    }, 1000);
  </script>
</body>
</html>
