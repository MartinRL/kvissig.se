name: Deploy

on:
  push:
    branches: [main]

# The build runs on fly's remote builder, so this job needs only flyctl — no .NET SDK.
jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-group   # never run two deploys at once
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
